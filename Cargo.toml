[package]
name = "rusty"
version = "0.1.0"
edition = "2021"
description = "Rusty - a terminal chatbot that answers questions and holds conversation"
license = "MIT"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
strip = true
