# Ask Rusty from GitHub: open an issue labelled "ask", comment "/rusty <question>",
# or run manually from the Actions tab.
name: Ask Rusty
on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      question:
        description: "Question for Rusty"
        required: true
permissions:
  issues: write
jobs:
  answer:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'ask')) ||
      (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/rusty') &&
       github.event.comment.user.type != 'Bot')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Ask
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          # passed via env, never interpolated into the script (prevents injection)
          DISPATCH_Q: ${{ github.event.inputs.question }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT: ${{ github.event.comment.body }}
          ISSUE_NUM: ${{ github.event.issue.number }}
        run: |
          case "${{ github.event_name }}" in
            workflow_dispatch) Q="$DISPATCH_Q" ;;
            issues)            Q="$ISSUE_TITLE"$'\n'"$ISSUE_BODY" ;;
            issue_comment)     Q="${COMMENT#/rusty}" ;;
          esac
          A="$(./target/release/rusty "$Q")"
          echo "$A" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$ISSUE_NUM" ]; then
            gh issue comment "$ISSUE_NUM" --body "🦀 **Rusty:** $A"
          fi
